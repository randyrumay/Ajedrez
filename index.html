<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Una pequeña partida ♟️</title>

<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;width:100%;min-height:100%;font-family:Georgia,"Times New Roman",serif}
body{
  background:radial-gradient(circle at center top,#4b3524 0%,#211711 55%,#100c09 100%);
  color:white;display:flex;justify-content:center;align-items:center;
  min-height:100vh;overflow:hidden
}
#app{width:100%;max-width:500px;min-height:100vh;padding:22px 14px;display:flex;flex-direction:column;justify-content:center;align-items:center}
.intro{text-align:center;margin-bottom:18px;animation:aparecer 1s ease}
.intro h1{font-size:25px;font-weight:normal;margin:0 0 8px}
.intro p{font-size:15px;opacity:.8;margin:0}
#progress{margin:10px 0 14px;font-size:13px;letter-spacing:2px;opacity:.7}
#board{
  width:min(92vw,400px);height:min(92vw,400px);max-width:400px;max-height:400px;
  display:grid;grid-template-columns:repeat(8,1fr);grid-template-rows:repeat(8,1fr);
  border:7px solid #5b3a20;border-radius:5px;
  box-shadow:0 15px 45px rgba(0,0,0,.55),inset 0 0 0 2px rgba(255,255,255,.08);
  touch-action:none;user-select:none
}
.square{position:relative;display:flex;justify-content:center;align-items:center;font-size:clamp(32px,9vw,50px);cursor:pointer;touch-action:none}
.light{background:#e5c99b}.dark{background:#795536}
.square.selected{box-shadow:inset 0 0 0 5px rgba(255,215,80,.9)}
.square.target{box-shadow:inset 0 0 0 5px rgba(255,235,130,.85),inset 0 0 25px rgba(255,210,70,.55);animation:pulso 1.1s infinite}
.square.target::after{content:"";width:18%;height:18%;border-radius:50%;background:rgba(255,255,255,.75);position:absolute}
.piece{position:relative;z-index:2;line-height:1;filter:drop-shadow(2px 3px 2px rgba(0,0,0,.45))}
.white-piece{color:#fffdf4;text-shadow:0 1px 1px #4d3928,1px 0 1px #4d3928,-1px 0 1px #4d3928}
.black-piece{color:#21170f;text-shadow:0 1px 1px rgba(255,255,255,.2)}
#message{min-height:44px;margin-top:17px;text-align:center;font-size:15px;opacity:.9}
#finalScreen{
  position:fixed;inset:0;z-index:20;display:none;justify-content:center;align-items:center;
  padding:25px;background:radial-gradient(circle at center,#60442d 0%,#211711 55%,#0c0907 100%);
  text-align:center
}
.final-content{animation:finalAparecer 1.5s ease}
.final-chess{font-size:55px;margin-bottom:20px;animation:flotar 2s ease-in-out infinite}
.final-text{font-size:clamp(30px,8vw,42px);line-height:1.25;margin:0}
.final-subtext{margin-top:25px;font-size:19px;opacity:.85}
.heart{display:inline-block;margin-top:18px;font-size:28px;animation:latido 1.5s infinite}
@keyframes aparecer{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}
@keyframes pulso{0%,100%{filter:brightness(1)}50%{filter:brightness(1.25)}}
@keyframes finalAparecer{from{opacity:0;transform:scale(.88)}to{opacity:1;transform:scale(1)}}
@keyframes flotar{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
@keyframes latido{0%,100%{transform:scale(1)}50%{transform:scale(1.25)}}
</style>
</head>

<body>
<div id="app">
  <div class="intro">
    <h1>♟️ Una pequeña partida</h1>
    <p>Hay una jugada preparada para ti...</p>
  </div>

  <div id="progress">JUGADA 1 DE 3</div>
  <div id="board"></div>
  <div id="message">Toca la pieza iluminada.</div>
</div>

<div id="finalScreen">
  <div class="final-content">
    <div class="final-chess">♟️</div>
    <p class="final-text">Me encanta tu sonrisa. 💛</p>
    <div class="final-subtext">Ahora mírame.</div>
    <div class="heart">♡</div>
  </div>
</div>

<script>
const boardElement=document.getElementById("board");
const progressElement=document.getElementById("progress");
const messageElement=document.getElementById("message");
const finalScreen=document.getElementById("finalScreen");

let board=[
 ["♜","♞","♝","♛","♚","♝","♞","♜"],
 ["♟","♟","♟","♟","♟","♟","♟","♟"],
 ["","","","","","","",""],
 ["","","","","","","",""],
 ["","","","","","","",""],
 ["","","","","","","",""],
 ["♙","♙","♙","♙","♙","♙","♙","♙"],
 ["♖","♘","♗","♕","♔","♗","♘","♖"]
];

const moves=[
 {from:"e2",to:"e4",text:"Muy bien... ahora encuentra la siguiente pieza. ♟️"},
 {from:"g1",to:"f3",text:"Perfecto. Solo queda una jugada. ♟️"},
 {from:"f1",to:"c4",text:""}
];

let currentMove=0;
let selectedSquare=null;
const files=["a","b","c","d","e","f","g","h"];

function coordinateToPosition(c){
  return {row:8-parseInt(c[1]),col:files.indexOf(c[0])};
}

function renderBoard(){
  boardElement.innerHTML="";
  for(let row=0;row<8;row++){
    for(let col=0;col<8;col++){
      const square=document.createElement("div");
      square.classList.add("square",(row+col)%2===0?"light":"dark");
      const coordinate=files[col]+(8-row);
      square.dataset.coordinate=coordinate;
      const piece=board[row][col];

      if(piece!==""){
        const span=document.createElement("span");
        span.classList.add("piece");
        if("♙♖♘♗♕♔".includes(piece)) span.classList.add("white-piece");
        else span.classList.add("black-piece");
        span.textContent=piece;
        square.appendChild(span);
      }

      square.addEventListener("pointerdown",handleSquareTap);
      boardElement.appendChild(square);
    }
  }
  highlightMove();
}

function highlightMove(){
  const move=moves[currentMove];
  if(!move)return;

  document.querySelectorAll(".square").forEach(s=>s.classList.remove("selected","target"));

  const fromSquare=document.querySelector(`[data-coordinate="${move.from}"]`);
  const toSquare=document.querySelector(`[data-coordinate="${move.to}"]`);

  if(fromSquare)fromSquare.classList.add("selected");
  if(toSquare)toSquare.classList.add("target");
}

function handleSquareTap(event){
  const coordinate=event.currentTarget.dataset.coordinate;
  const move=moves[currentMove];

  if(coordinate===move.from){
    selectedSquare=coordinate;
    messageElement.textContent="Ahora toca la casilla iluminada ✨";
    document.querySelectorAll(".square").forEach(s=>s.classList.remove("selected"));
    event.currentTarget.classList.add("selected");
    return;
  }

  if(selectedSquare===move.from && coordinate===move.to){
    executeMove(move);
    return;
  }

  messageElement.textContent=selectedSquare!==null
    ?"Toca la casilla que está iluminada ✨"
    :"Busca la pieza iluminada ♟️";
}

function executeMove(move){
  const from=coordinateToPosition(move.from);
  const to=coordinateToPosition(move.to);

  board[to.row][to.col]=board[from.row][from.col];
  board[from.row][from.col]="";
  selectedSquare=null;
  currentMove++;
  renderBoard();

  if(currentMove>=moves.length){
    progressElement.textContent="JUGADA COMPLETADA";
    messageElement.textContent="";
    setTimeout(()=>{finalScreen.style.display="flex"},900);
    return;
  }

  progressElement.textContent=`JUGADA ${currentMove+1} DE 3`;
  messageElement.textContent=move.text;
}

renderBoard();
</script>
</body>
</html>
